<!-- =============================================================================
     Wazuh Configuration — Relevant Excerpts
     Project: Network & Host IDS Lab
     Full config: /var/ossec/etc/ossec.conf
     Only modified/added sections are shown below
     Applied to: Wazuh Manager (10.10.1.131) and Wazuh Agent on Victim (10.10.1.133)
============================================================================= -->


<!-- ==========================================================================
     SECTION 1: LOG COLLECTION (Sensor Agent — 10.10.1.132)
     Added to /var/ossec/etc/ossec.conf on Sensor
     Wazuh Agent ships these logs to Manager for correlation
=========================================================================== -->

<!-- Suricata eve.json — primary network alert feed -->
<localfile>
  <log_format>json</log_format>
  <location>/var/log/suricata/eve.json</location>
</localfile>

<!-- Zeek conn.log — full connection metadata -->
<localfile>
  <log_format>syslog</log_format>
  <location>/opt/zeek/logs/current/conn.log</location>
</localfile>

<!-- Zeek dns.log — DNS query metadata (key for exfil detection) -->
<localfile>
  <log_format>syslog</log_format>
  <location>/opt/zeek/logs/current/dns.log</location>
</localfile>

<!-- Zeek http.log — HTTP request metadata -->
<localfile>
  <log_format>syslog</log_format>
  <location>/opt/zeek/logs/current/http.log</location>
</localfile>


<!-- ==========================================================================
     SECTION 2: FILE INTEGRITY MONITORING (Victim Agent — 10.10.1.133)
     Added to /var/ossec/etc/ossec.conf on Victim
     realtime="yes" ensures immediate detection, not waiting for scheduled scan
=========================================================================== -->

<syscheck>
  <frequency>300</frequency>
  <alert_new_files>yes</alert_new_files>

  <!-- Persistence locations — crontab backdoor detection (T1053.003) -->
  <directories check_all="yes" realtime="yes">/var/spool/cron/crontabs</directories>
  <directories check_all="yes" realtime="yes">/etc/cron.d</directories>
  <directories check_all="yes" realtime="yes">/etc/crontab</directories>

  <!-- Privilege escalation indicators -->
  <directories check_all="yes" realtime="yes">/etc/passwd</directories>
  <directories check_all="yes" realtime="yes">/etc/shadow</directories>
  <directories check_all="yes" realtime="yes">/etc/sudoers</directories>

  <!-- Web shell detection — monitor upload directory -->
  <directories check_all="yes" realtime="yes">/var/www/html</directories>
</syscheck>


<!-- ==========================================================================
     SECTION 3: ACTIVE RESPONSE (Wazuh Manager — 10.10.1.131)
     Auto-blocks attacker IP via iptables when critical rules fire
     firewall-drop command adds iptables DROP rule on the affected agent
=========================================================================== -->

<!-- Block IP on SSH brute force detection (T1110) — 5 minute block -->
<active-response>
  <command>firewall-drop</command>
  <location>local</location>
  <rules_id>100002</rules_id>
  <timeout>300</timeout>
</active-response>

<!-- Block IP on port scan detection (T1046) — 5 minute block -->
<active-response>
  <command>firewall-drop</command>
  <location>local</location>
  <rules_id>100001</rules_id>
  <timeout>300</timeout>
</active-response>

<!-- Block IP on web shell activity (T1505.003, T1059) — 10 minute block -->
<active-response>
  <command>firewall-drop</command>
  <location>local</location>
  <rules_id>100005,100006</rules_id>
  <timeout>600</timeout>
</active-response>


<!-- ==========================================================================
     SECTION 4: SLACK INTEGRATION (Wazuh Manager — 10.10.1.131)
     Real-time Slack alerts for custom rules only (level >= 8)
     Uses Wazuh built-in Slack integration
=========================================================================== -->

<integration>
  <name>slack</name>
  <hook_url>https://hooks.slack.com/services/REDACTED</hook_url>
  <level>8</level>
  <rule_id>100001,100002,100003,100004,100005,100006,100007,100008</rule_id>
  <alert_format>json</alert_format>
</integration>
